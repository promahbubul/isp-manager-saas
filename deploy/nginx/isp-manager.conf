# Nginx site for ISP Manager. Replace yourdomain.com everywhere, then:
#   sudo cp deploy/nginx/isp-manager.conf /etc/nginx/sites-available/isp-manager
#   sudo ln -s /etc/nginx/sites-available/isp-manager /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com -d app.yourdomain.com -d api.yourdomain.com
# Certbot adds the HTTPS (443) blocks and the HTTP→HTTPS redirect.

# ── API: api.yourdomain.com → Express (PM2 isp-api on :5000) ──
upstream isp_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.yourdomain.com;

    # Excel imports are limited to 5 MB in the app
    client_max_body_size 6m;

    location / {
        proxy_pass http://isp_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # bKash/SSLCommerz verification calls can take a while
        proxy_read_timeout 60s;
    }
}

# ── Frontend: yourdomain.com, www, app → Next.js (PM2 isp-web on :3000) ──
upstream isp_web {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com app.yourdomain.com;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /_next/static/ {
        proxy_pass http://isp_web;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://isp_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

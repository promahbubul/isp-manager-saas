<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #f1f5f9; display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
      .box { background: #fff; padding: 28px; border-radius: 12px; max-width: 320px; text-align: center; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
      h1 { font-size: 20px; color: #581c87; margin: 0 0 8px; }
      p { color: #475569; margin: 6px 0; }
      button { margin-top: 14px; background: #7e22ce; color: #fff; border: 0; padding: 10px 18px; border-radius: 8px; font-size: 15px; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>No internet connection</h1>
            <p>You are offline. Restart your router and try again. If it still does not work, call your ISP.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
